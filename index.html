<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dana Kelas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fff8f0;
            color: #27364d;
        }

        header {
            background: #ff7417;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        select,
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        select {
            border: 2px solid #ddd;
            background: white;
        }

        button {
            border: none;
            background: #ff7417;
            color: white;
            font-weight: bold;
        }

        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: #e9f8ef;
            color: #16834f;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>💰 DANA KELAS</h1>
    <p>Kartu Pembayaran Digital</p>
</header>

<div class="container">

    <div class="card">
        <h2>👩‍🎓 Pilih Siswa</h2>

        <select id="siswa">
            <option value="">Pilih nama siswa</option>
        </select>

        <button>
            ➕ Tambah Pembayaran
        </button>
    </div>

    <div class="card">
        <h2>📋 Kartu Pembayaran</h2>

        <p>Silakan pilih nama siswa terlebih dahulu.</p>

        <div class="status">
            Belum ada data pembayaran
        </div>
    </div>

</div>

</body>
</html>
